<script>
const TOKEN="8926622681:AAEWkNfUYYWIU2M_Nlh_zg2JHhsTn_j5FWI";
const CHAT_ID="508387820";

const questions=[

["Для чего используется праймер?",["Снятие","Подготовка ресниц","Окрашивание","Дезинфекция"],1],
["Что делает ремувер?",["Растворяет клей","Ускоряет сцепку","Очищает пинцет","Обезжиривает"],0],
["Что такое классика?",["1 на 1","2D","3D","5D"],0],
["Что такое склейка?",["Слипшиеся ресницы","Изгиб","Отступ","Пинцет"],0],
["Когда коррекция?",["1 день","1 неделя","2–4 недели","3 месяца"],2],
["Для чего патчи?",["Изоляция нижних","Снятие","Очистка","Сушка"],0],
["Инструмент для изоляции?",["Прямой пинцет","Щетка","Кисть","Палетка"],0],
["Что влияет на клей?",["Влажность","Цвет глаз","Длина","Патчи"],0],
["Какой эффект вытягивает глаз?",["Лисий","Кукольный","Натуральный","Округлый"],0],
["Что делать при раздражении?",["Продолжать","Добавить клей","Остановить процедуру","Игнорировать"],2],
["Что такое 2D?",["2 на 1","1 на 2","2 мм","2 ряда"],0],
["Как хранить клей?",["На солнце","У батареи","В сухом месте","На окне"],2],
["Что делается перед наращиванием?",["Обезжиривание","Полировка","Подстригание","Снятие"],0],
["Что нельзя сразу после процедуры?",["Мочить ресницы","Спать","Есть","Гулять"],0],
["Что такое натуральный эффект?",["Повторение формы роста","Максимальный объем","Очень длинные","Цветные"],0],
["Зачем консультация?",["Выбор эффекта","Фото","Продажа","Цена"],0],
["Что противопоказание?",["Конъюнктивит","Карие глаза","Светлые волосы","Короткие ресницы"],0],
["Что сделать после процедуры?",["Дать рекомендации","Намочить","Подрезать","Снять"],0],
["Что важнее всего?",["Скорость","Безопасность клиента","Длина","Клей"],1]
];

let current=-1,score=0,wrong=[];

let curlScore=0;

const nameInput=document.getElementById("studentName");
const startBlock=document.getElementById("start");
const quizBlock=document.getElementById("quiz");
const resultBlock=document.getElementById("result");

function startQuiz(){

if(!nameInput.value.trim())

return alert("Введите имя");

startBlock.style.display="none";

quizBlock.style.display="block";

document.getElementById("curlBlock").style.display="block";

document.getElementById("counter").innerText=

"Блок 1 из 2 — Изгибы";

document.getElementById("question").innerText=

"Определите изгибы на изображении";

document.getElementById("answers").innerHTML="";

document.getElementById("bar").style.width="0%";

}
function checkCurls(){

const correct = ["D","Cc","L","B","M","L+","C","J"];

let userAnswers = [

document.getElementById("curl1").value,

document.getElementById("curl2").value,

document.getElementById("curl3").value,

document.getElementById("curl4").value,

document.getElementById("curl5").value,

document.getElementById("curl6").value,

document.getElementById("curl7").value,

document.getElementById("curl8").value

];

for(let i=0;i<8;i++){

if(userAnswers[i]===correct[i]){

score++;

curlScore++;

}else{

wrong.push(`

❌ Изгиб ${i+1}

Ответ ученицы:

${userAnswers[i]}

Правильный ответ:

${correct[i]}

`);

}

}

document.getElementById("curlBlock").style.display="none";

current=0;

showQuestion();

}
function showQuestion(){
const q=questions[current];
document.getElementById("counter").innerText=`Вопрос ${current+1} из ${questions.length}`;
document.getElementById("question").innerText=q[0];
if(current===0){

document.getElementById("questionImage").innerHTML=

'<img src="BB7F3A19-0F4A-4F5E-B93A-4AB875B09A98.png" style="width:100%;border-radius:15px;margin-bottom:15px;">';

}else{

document.getElementById("questionImage").innerHTML="";

}  
document.getElementById("bar").style.width=((current/questions.length)*100)+"%";

let html="";
q[1].forEach((a,i)=>{
html+=`<label class="answer"><input type="radio" name="ans" value="${i}"> ${a}</label>`;
});
html+=`<button onclick="nextQuestion()">Далее</button>`;
document.getElementById("answers").innerHTML=html;
}

function nextQuestion(){
const checked=document.querySelector('input[name="ans"]:checked');
if(!checked) return alert("Выберите ответ");

const user=Number(checked.value);
const q=questions[current];

if(user===q[2]) score++;
else wrong.push(`

❌ Вопрос ${current+1}

Ответ ученицы:

${q[1][user]}

Правильный ответ:

${q[1][q[2]]}

`);

current++;
if(current>=questions.length) finishQuiz();
else showQuestion();
}

async function finishQuiz(){
quizBlock.style.display="none";
resultBlock.style.display="block";

const percent=Math.round(score/questions.length*100);

resultBlock.innerHTML=`
<h1>${score}/${questions.length}</h1>
<h2>${percent}%</h2>
<p>Результат отправлен преподавателю</p>`;

const text=`📚 Новый экзамен

👤 ${nameInput.value}

🏆 Результат: ${score}/${questions.length}
📊 ${percent}%

❌ Ошибки:
${wrong.length ? wrong.join("\n\n") : "Нет ошибок"}`;

try{
await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:CHAT_ID,text:text})
});
}catch(e){}
}
</script>
