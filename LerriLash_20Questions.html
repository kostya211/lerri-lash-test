<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lerri Lash</title>

<style>

body{

background:#3b2718;

color:white;

font-family:Arial;

padding:20px;

text-align:center;

}

.card{

max-width:600px;

margin:auto;

background:#5b3a22;

padding:20px;

border-radius:15px;

}

button{

padding:12px 20px;

border:none;

border-radius:10px;

background:#d8b07a;

font-weight:bold;

}

input{

width:100%;

padding:12px;

margin:10px 0;

border:none;

border-radius:10px;

}

</style>

</head>

<body>

<div class="card">

<h1>Lerri Lash</h1>

<input id="name" placeholder="Введите имя">

<button onclick="test()">Начать тест</button>

<div id="result"></div>

</div>

<script>

function test(){

const name=document.getElementById("name").value;

if(!name){

alert("Введите имя");

return;

}

document.getElementById("result").innerHTML=

"<h2>Привет, "+name+"!</h2><p>Тест работает ✅</p>";

}

</script>

</body>

</html>
